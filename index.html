    html, body {

    .container {
      position: relative;

    .floating-image {
      position: absolute;
      opacity: 0.8;
    }
    .floating-image img {
      width: 100%;

      display: block;

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Positions</title>
    <style>
        body {
            height: 200vh;
            margin: 0;
            position: relative;
        }

        img {
            width: 150px;
            position: absolute;
        }

        .top-left {
            top: 10px;
            left: 10px;
        }

        .top-right {
            top: 10px;
            right: 10px;
        }

        .center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .bottom-left {
            bottom: 10px;
            left: 10px;
        }

        .bottom-right {
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>

    <img src="IMG_5878.jpeg" class="top-left" alt="Image">
    <img src="IMG_5878.jpeg" class="top-right" alt="Image">
    <img src="IMG_5878.jpeg" class="center" alt="Image">
    <img src="IMG_5878.jpg" class="bottom-left" alt="Image">
    <img src="IMG_5878.jpeg" class="bottom-right" alt="Image">

</body>
</html>
