<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>callumgoat.github.io</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
    }
    body {
      background: url("IMG_5878.jpeg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .overlay {
      width: 100%;
      min-height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .content {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.4rem, 4vw, 4.5rem);
      letter-spacing: 0.05em;
    }
    p {
      margin: 0;
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="content">
      <h1>callumgoat.github.io</h1>
      <p>This site is ready for deployment to Cloudflare Pages with <strong>IMG_5878.jpeg</strong> as the full-page background.</p>
    </div>
  </div>
</body>
</html>
