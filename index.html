<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jaden Leo</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #111;
    }

    .img {
        position: absolute;
        width: 300px; /* slightly smaller = more reliable */
        pointer-events: none;
    }
</style>
</head>

<body>

<script>
const imageSources = ["IMG_1.jpg", "IMG_2.jpg", "IMG_3.jpg"];
const images = [];
const totalImages = 12;
const size = 300;

function createImages() {
    for (let i = 0; i < totalImages; i++) {
        const img = document.createElement("img");
        img.src = imageSources[i % imageSources.length];
        img.className = "img";
        document.body.appendChild(img);

        let x, y, placed = false;
        let attempts = 0;

        // Try up to 100 times to find non-overlapping spot
        while (!placed && attempts < 100) {
            x = Math.random() * (window.innerWidth - size);
            y = Math.random() * (window.innerHeight - size);

            let overlapping = false;

            for (let other of images) {
                if (Math.abs(x - other.x) < size &&
                    Math.abs(y - other.y) < size) {
                    overlapping = true;
                    break;
                }
            }

            if (!overlapping) placed = true;
            attempts++;
        }

        // If no perfect spot found, just place it anyway
        if (!placed) {
            x = Math.random() * (window.innerWidth - size);
            y = Math.random() * (window.innerHeight - size);
        }

        const dx = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? -1 : 1);
        const dy = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? -1 : 1);

        const obj = { el: img, x, y, dx, dy };
        images.push(obj);

        img.style.left = x + "px";
        img.style.top = y + "px";
    }
}

function update() {
    for (let img of images) {
        img.x += img.dx;
        img.y += img.dy;

        if (img.x <= 0 || img.x + size >= window.innerWidth) {
            img.dx *= -1;
        }

        if (img.y <= 0 || img.y + size >= window.innerHeight) {
            img.dy *= -1;
        }

        img.el.style.left = img.x + "px";
        img.el.style.top = img.y + "px";
    }

    requestAnimationFrame(update);
}

createImages();
update();
</script>

</body>
</html>
